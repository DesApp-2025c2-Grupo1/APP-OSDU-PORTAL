# ─── Docker Compose — PRODUCCIÓN ─────────────────────────────────────────────
# Uso: docker compose -f docker-compose.prod.yml up -d
# Sin puertos de DB expuestos. Sin herramientas de dev. Con nginx + SSL.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Nginx (reverse proxy + SSL) ────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: portal-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
      - uploads_data:/app/public/uploads:ro
    networks:
      - portal-network
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ── Certbot (renovación SSL automática) ────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: portal-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    # Certbot solo corre cuando se lo invoca manualmente o via cron
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ── API ────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      target: production
    image: unahur/portal-api:${IMAGE_TAG:-latest}
    container_name: portal-api
    restart: unless-stopped
    # En producción NO se expone el puerto directamente — solo a través de nginx
    expose:
      - "5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:?Variable DB_USER requerida}
      DB_PASSWORD: ${DB_PASSWORD:?Variable DB_PASSWORD requerida}
      DB_NAME: ${DB_NAME:?Variable DB_NAME requerida}
      JWT_SECRET: ${JWT_SECRET:?Variable JWT_SECRET requerida}
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD:?Variable DEFAULT_USER_PASSWORD requerida}
      SMTP_HOST: ${SMTP_HOST:?Variable SMTP_HOST requerida}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM:?Variable EMAIL_FROM requerida}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Variable ALLOWED_ORIGINS requerida}
    volumes:
      - uploads_data:/app/public/uploads
    networks:
      - portal-network
    depends_on:
      db:
        condition: service_healthy
    # Límites de recursos — ajustar según VPS (mínimo recomendado: 1GB RAM)
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ── Base de datos ──────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: portal-db
    restart: unless-stopped
    # NUNCA exponer el puerto de DB en producción
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - portal-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ─── Volumes ─────────────────────────────────────────────────────────────────
volumes:
  db_data:
    name: portal-db-data
  uploads_data:
    name: portal-uploads
  certbot_www:
    name: portal-certbot-www
  certbot_conf:
    name: portal-certbot-conf
  nginx_logs:
    name: portal-nginx-logs

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  portal-network:
    name: portal-network-prod
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
